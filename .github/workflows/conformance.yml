name: Mesh conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Run conformance tests
        run: python -m unittest discover -s tests -v
      - name: Exercise CLI against fixtures
        run: |
          python -m mesh_conformance.manifest fixtures/valid/manifest-minimal.json
          if python -m mesh_conformance.manifest fixtures/invalid/manifest-missing-id.json; then
            echo "Invalid fixture unexpectedly passed" >&2
            exit 1
          fi
